<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>DXF Viewer</title>
<style>
:root{--bg:#0e1014;--panel:rgba(20,23,29,.92);--line:rgba(255,255,255,.09);--txt:#e9ecf1;--mute:#8b93a1;--acc:#3d9bff;--card:#1a1e25}
body.light{--bg:#f3f4f6;--panel:rgba(255,255,255,.94);--line:rgba(0,0,0,.09);--txt:#14171c;--mute:#6b7280;--acc:#0a6cff;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;gap:4px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 8px calc(env(safe-area-inset-left) + 12px);
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.title{flex:1;min-width:0;padding-right:4px}
.title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:0;background:transparent;color:var(--txt);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.btn:active{background:var(--line)}
.btn.on{background:var(--acc);color:#fff}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.open{appearance:none;border:0;background:var(--acc);color:#fff;border-radius:11px;height:38px;padding:0 13px 0 10px;font:600 14px/1 inherit;font-family:inherit;display:flex;gap:6px;align-items:center;cursor:pointer;flex:none}
.open svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;gap:10px;
  padding:7px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 7px) calc(env(safe-area-inset-left) + 12px);
  font:11.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mute);background:var(--panel);border-top:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#measure{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 44px);z-index:6;display:none;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);min-width:230px;text-align:center}
#measure .big{font:700 20px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
#measure .sm{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute)}
#measure .hint{font-size:13px;color:var(--mute)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:68vh;display:flex;flex-direction:column;background:var(--card);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
@media (min-width:760px){.sheet{left:auto;right:12px;top:calc(env(safe-area-inset-top) + 66px);bottom:auto;width:340px;border-radius:16px;border:1px solid var(--line);transform:translateX(120%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--line)}
.sh-head b{flex:1;font-size:16px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:999px;padding:6px 11px;font:500 12.5px/1 inherit;font-family:inherit;cursor:pointer}
.chip:active{background:var(--line)}
#layerList{overflow:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.lr{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.lr:active{background:var(--line)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--line)}
.ln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.tg{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.lr.vis .tg{background:var(--acc)} .lr.vis .tg::after{left:19px}
.lr:not(.vis) .ln{opacity:.5}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.25);display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:20;background:var(--card);color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:88vw;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.35)}
#loading div{background:var(--card);padding:16px 22px;border-radius:14px;font-weight:600;display:flex;gap:12px;align-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#drop{position:fixed;inset:10px;z-index:40;border:3px dashed var(--acc);border-radius:20px;display:none;place-items:center;font-size:20px;font-weight:600;background:rgba(61,155,255,.08);pointer-events:none}
input[type=file]{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="bar">
  <div class="title"><b id="fname">Sample drawing</b><span id="finfo">Open a .dxf file to view it</span></div>
  <button class="open" id="openBtn" aria-label="Open DXF file"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</button>
  <button class="btn" id="fitBtn" aria-label="Zoom to fit" title="Zoom to fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button class="btn" id="measureBtn" aria-label="Measure" title="Measure distance"><svg viewBox="0 0 24 24"><path d="M3 16.5 16.5 3 21 7.5 7.5 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="btn" id="layersBtn" aria-label="Layers" title="Layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="btn" id="themeBtn" aria-label="Toggle background" title="Light / dark background"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/></svg></button>
</div>

<div class="status"><span id="coords">x —  y —</span><span id="zoomInfo"></span></div>

<div id="measure"><div class="hint" id="mHint">Tap the first point</div><div class="big" id="mDist"></div><div class="sm" id="mDet"></div></div>

<div id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head"><b>Layers</b><button class="chip" id="allOn">All on</button><button class="chip" id="allOff">All off</button></div>
  <div id="layerList"></div>
</div>

<div id="toast"></div>
<div id="loading"><div><span class="spin"></span>Reading drawing…</div></div>
<div id="drop">Drop DXF file to open</div>
<input type="file" id="file">

<script>
"use strict";
/* ============================== DXF PARSER ============================== */
function parseDXF(text){
  const L = text.split(/\r\n|\r|\n/);
  const P = [];
  for(let i=0;i+1<L.length;i+=2){
    const c = parseInt(L[i], 10);
    if(isNaN(c)){ i--; continue; }
    P.push([c, L[i+1].replace(/\s+$/,'')]);
  }
  const out = {layers:{}, blocks:{}, entities:[], header:{}};
  let i = 0;
  const isZero = (k, v) => P[k] && P[k][0]===0 && P[k][1].trim()===v;

  function readEnt(k){
    const ent = {type:P[k][1].trim(), c:[], f:{}};
    k++;
    while(k<P.length && P[k][0]!==0){
      const pr=P[k]; ent.c.push(pr);
      if(!(pr[0] in ent.f)) ent.f[pr[0]] = pr[1];
      k++;
    }
    ent.layer = (ent.f[8]!==undefined ? ent.f[8].trim() : '0') || '0';
    ent.color = ent.f[62]!==undefined ? parseInt(ent.f[62],10) : 256;
    if(ent.f[420]!==undefined) ent.tc = parseInt(ent.f[420],10);
    return [ent, k];
  }
  function readEntities(k, list, stops){
    while(k<P.length){
      if(P[k][0]!==0){ k++; continue; }
      const t = P[k][1].trim();
      if(stops.includes(t) || t==='EOF') return k;
      let e; [e,k] = readEnt(k);
      if(e.type==='POLYLINE'){
        e.verts=[];
        while(k<P.length && P[k][0]===0 && P[k][1].trim()==='VERTEX'){ let v; [v,k]=readEnt(k); e.verts.push(v); }
        if(isZero(k,'SEQEND')){ let s; [s,k]=readEnt(k); }
      } else if(e.type==='INSERT'){
        e.attribs=[];
        while(k<P.length && P[k][0]===0 && P[k][1].trim()==='ATTRIB'){ let a; [a,k]=readEnt(k); e.attribs.push(a); }
        if(isZero(k,'SEQEND')){ let s; [s,k]=readEnt(k); }
      }
      list.push(e);
    }
    return k;
  }

  while(i<P.length){
    if(isZero(i,'SECTION') && P[i+1]){
      const name = P[i+1][1].trim(); i+=2;
      if(name==='ENTITIES'){ i = readEntities(i, out.entities, ['ENDSEC']); }
      else if(name==='TABLES'){
        while(i<P.length && !isZero(i,'ENDSEC')){
          if(P[i][0]===0){
            let e; [e,i]=readEnt(i);
            if(e.type==='LAYER'){
              const nm = (e.f[2]||'0').trim();
              const col = e.f[62]!==undefined ? parseInt(e.f[62],10) : 7;
              const fl = parseInt(e.f[70]||'0',10);
              out.layers[nm] = {name:nm, aci:Math.abs(col)||7, tc:e.f[420]!==undefined?parseInt(e.f[420],10):null, visible: col>=0 && !(fl&1)};
            }
          } else i++;
        }
      }
      else if(name==='BLOCKS'){
        while(i<P.length && !isZero(i,'ENDSEC')){
          if(isZero(i,'BLOCK')){
            let b; [b,i]=readEnt(i);
            const blk = {name:(b.f[2]||'').trim(), bx:+b.f[10]||0, by:+b.f[20]||0, entities:[]};
            i = readEntities(i, blk.entities, ['ENDBLK','ENDSEC']);
            if(isZero(i,'ENDBLK')){ let x; [x,i]=readEnt(i); }
            out.blocks[blk.name]=blk;
          } else i++;
        }
      }
      else if(name==='HEADER'){
        while(i<P.length && !isZero(i,'ENDSEC')){
          if(P[i][0]===9 && P[i][1].trim()==='$INSUNITS' && P[i+1]) out.header.units = parseInt(P[i+1][1],10);
          i++;
        }
      }
      else { while(i<P.length && !isZero(i,'ENDSEC')) i++; }
    } else i++;
  }
  return out;
}

/* ============================== COLORS ============================== */
function hsv(h,s,v){
  const f=(n)=>{const k=(n+h/60)%6; return v - v*s*Math.max(0,Math.min(k,4-k,1));};
  return rgbHex(f(5)*255,f(3)*255,f(1)*255);
}
function rgbHex(r,g,b){ return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join(''); }
const ACI_BASE={1:'#ff0000',2:'#ffff00',3:'#00ff00',4:'#00ffff',5:'#0000ff',6:'#ff00ff',7:'FG',8:'#808080',9:'#c0c0c0'};
function aci(i){
  i = Math.abs(i);
  if(ACI_BASE[i]) return ACI_BASE[i];
  if(i>=250 && i<=255){ const g=[51,91,132,173,214,255][i-250]; return rgbHex(g,g,g); }
  if(i>=10 && i<=249){
    const h=Math.floor((i-10)/10)*15, k=i%10;
    const v=[1,1,.8,.8,.6,.6,.5,.5,.3,.3][k], s=(k%2)?0.5:1;
    return hsv(h,s,v);
  }
  return 'FG';
}
const tcHex = n => '#'+(n & 0xffffff).toString(16).padStart(6,'0');

/* ============================== GEOMETRY ============================== */
const TAU = Math.PI*2, D2R = Math.PI/180;
const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1], A[1]*B[0]+A[3]*B[1], A[0]*B[2]+A[2]*B[3], A[1]*B[2]+A[3]*B[3], A[0]*B[4]+A[2]*B[5]+A[4], A[1]*B[4]+A[3]*B[5]+A[5]];
const T=(x,y)=>[1,0,0,1,x,y], S=(x,y)=>[x,0,0,y,0,0], R=(a)=>[Math.cos(a),Math.sin(a),-Math.sin(a),Math.cos(a),0,0];
const MIRX=[-1,0,0,1,0,0];

function ellPts(cx,cy,mx,my,ratio,t0,t1,out){
  const nx=-my*ratio, ny=mx*ratio;
  const sweep=t1-t0, n=Math.max(4, Math.ceil(Math.abs(sweep)/TAU*96));
  for(let k=0;k<=n;k++){ const t=t0+sweep*k/n, c=Math.cos(t), s=Math.sin(t); out.push(cx+mx*c+nx*s, cy+my*c+ny*s); }
  return out;
}
function bulgeTo(x1,y1,x2,y2,b,out){ // pushes intermediate points (excl. endpoints)
  const th=4*Math.atan(b), dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy);
  if(d<1e-12) return;
  const r=d/(2*Math.sin(th/2)), h=r*Math.cos(th/2);
  const cx=(x1+x2)/2 - dy/d*h, cy=(y1+y2)/2 + dx/d*h;
  const a0=Math.atan2(y1-cy,x1-cx), rr=Math.abs(r);
  const n=Math.max(2, Math.ceil(Math.abs(th)/TAU*96));
  for(let k=1;k<n;k++){ const a=a0+th*k/n; out.push(cx+rr*Math.cos(a), cy+rr*Math.sin(a)); }
}
function polyBulge(vs, closed, out){
  const n=vs.length;
  for(let k=0;k<n;k++){
    const v=vs[k]; out.push(v[0],v[1]);
    const nx = k<n-1 ? vs[k+1] : (closed ? vs[0] : null);
    if(nx && v[2]) bulgeTo(v[0],v[1],nx[0],nx[1],v[2],out);
  }
  if(closed && n>1) out.push(vs[0][0],vs[0][1]);
  return out;
}
function splinePts(ctrl, knots, p, w){
  const n=ctrl.length, out=[];
  if(n<2) return out;
  if(!p || knots.length!==n+p+1){ ctrl.forEach(c=>out.push(c[0],c[1])); return out; }
  const u0=knots[p], u1=knots[n], steps=Math.min(2000, Math.max(16, n*12));
  for(let s=0;s<=steps;s++){
    const u = u0+(u1-u0)*s/steps;
    let k=p; while(k<n-1 && u>=knots[k+1]) k++;
    const d=[];
    for(let j=0;j<=p;j++){ const c=ctrl[j+k-p], ww=w?w[j+k-p]:1; d.push([c[0]*ww,c[1]*ww,ww]); }
    for(let r=1;r<=p;r++) for(let j=p;j>=r;j--){
      const den=knots[j+1+k-r]-knots[j+k-p], a = den ? (u-knots[j+k-p])/den : 0;
      d[j]=[(1-a)*d[j-1][0]+a*d[j][0],(1-a)*d[j-1][1]+a*d[j][1],(1-a)*d[j-1][2]+a*d[j][2]];
    }
    out.push(d[p][0]/d[p][2], d[p][1]/d[p][2]);
  }
  return out;
}
function cleanText(s){
  return s.replace(/%%[cC]/g,'⌀').replace(/%%[dD]/g,'°').replace(/%%[pP]/g,'±').replace(/%%[uUoOkK]/g,'')
          .replace(/%%(\d{3})/g,(m,n)=>String.fromCharCode(+n)).replace(/\\U\+([0-9a-fA-F]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
}
function cleanMText(s){
  s = s.replace(/\\P/g,'\n').replace(/\\U\+([0-9a-fA-F]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16)))
       .replace(/\\S([^;]*?)[\^#\/]([^;]*?);/g,'$1/$2')
       .replace(/\\[ACcFfHhQqTtWwp][^;\\]*;/g,'')
       .replace(/\\[LlOoKkNX]/g,'').replace(/\\~/g,' ').replace(/[{}]/g,'').replace(/\\\\/g,'\\');
  return cleanText(s);
}

/* ============================== SCENE BUILD ============================== */
let scene=null;
const OCS = new Set(['ARC','CIRCLE','LWPOLYLINE','POLYLINE','INSERT','TEXT','ATTRIB','SOLID','TRACE','HATCH']);

function buildScene(dxf){
  const prims=[], texts=[], points=[], snaps=[], layers=dxf.layers, counts={}, unsupported={};
  let total=0;
  const num=(e,c,d)=>{ const v=e.f[c]; if(v===undefined) return d; const x=parseFloat(v); return isNaN(x)?d:x; };
  const getLayer=(nm)=>{ if(!layers[nm]) layers[nm]={name:nm,aci:7,tc:null,visible:true}; return layers[nm]; };
  const layerColor=(L)=> L.tc!=null ? tcHex(L.tc) : aci(L.aci);
  const tp=(M,x,y)=>[M[0]*x+M[2]*y+M[4], M[1]*x+M[3]*y+M[5]];
  const xf=(M,pts)=>{ const o=new Array(pts.length); for(let k=0;k<pts.length;k+=2){ o[k]=M[0]*pts[k]+M[2]*pts[k+1]+M[4]; o[k+1]=M[1]*pts[k]+M[3]*pts[k+1]+M[5]; } return o; };
  const snap=(M,x,y)=>{ const q=tp(M,x,y); snaps.push(q[0],q[1]); };

  function emit(e, M, pLayer, pColor, depth){
    const lname = (e.layer==='0' && pLayer!=null) ? pLayer : e.layer;
    const L = getLayer(lname);
    let color;
    if(e.tc!==undefined && !isNaN(e.tc)) color=tcHex(e.tc);
    else if(e.color===256 || isNaN(e.color)) color=layerColor(L);
    else if(e.color===0) color = pColor || 'FG';
    else color=aci(e.color);
    if(depth===0){ counts[lname]=(counts[lname]||0)+1; total++; }
    const Mo = (OCS.has(e.type) && num(e,230,1)<0) ? mul(M,MIRX) : M;
    const line=(pts,closed)=>{ if(pts.length>=4) prims.push({L:lname,C:color,pts:xf(Mo,pts),closed}); };
    const fill=(loops,alpha)=>{ const ls=loops.filter(l=>l.length>=6).map(l=>xf(Mo,l)); if(ls.length) prims.push({L:lname,C:color,loops:ls,fill:alpha}); };

    switch(e.type){
      case 'LINE': {
        const x1=num(e,10,0),y1=num(e,20,0),x2=num(e,11,0),y2=num(e,21,0);
        line([x1,y1,x2,y2]); snap(Mo,x1,y1); snap(Mo,x2,y2); break; }
      case 'CIRCLE': {
        const cx=num(e,10,0),cy=num(e,20,0),r=num(e,40,0);
        line(ellPts(cx,cy,r,0,1,0,TAU,[]),true); snap(Mo,cx,cy);
        [0,90,180,270].forEach(a=>snap(Mo,cx+r*Math.cos(a*D2R),cy+r*Math.sin(a*D2R))); break; }
      case 'ARC': {
        const cx=num(e,10,0),cy=num(e,20,0),r=num(e,40,0); let a0=num(e,50,0)*D2R, a1=num(e,51,360)*D2R;
        while(a1<=a0) a1+=TAU;
        line(ellPts(cx,cy,r,0,1,a0,a1,[])); snap(Mo,cx,cy);
        snap(Mo,cx+r*Math.cos(a0),cy+r*Math.sin(a0)); snap(Mo,cx+r*Math.cos(a1),cy+r*Math.sin(a1)); break; }
      case 'ELLIPSE': {
        const cx=num(e,10,0),cy=num(e,20,0),mx=num(e,11,1),my=num(e,21,0),ra=num(e,40,1);
        let t0=num(e,41,0), t1=num(e,42,TAU); while(t1<=t0) t1+=TAU;
        const ME = num(e,230,1)<0 ? mul(M,MIRX) : M;
        const pts=ellPts(cx,cy,mx,my,ra,t0,t1,[]);
        prims.push({L:lname,C:color,pts:xf(ME,pts),closed:Math.abs(t1-t0-TAU)<1e-6});
        snap(ME,cx,cy); break; }
      case 'LWPOLYLINE': {
        const vs=[]; for(const [c,v] of e.c){ if(c===10) vs.push([+v,0,0]); else if(c===20&&vs.length) vs[vs.length-1][1]=+v; else if(c===42&&vs.length) vs[vs.length-1][2]=+v; }
        const closed=!!(num(e,70,0)&1);
        line(polyBulge(vs,closed,[]),closed); vs.forEach(v=>snap(Mo,v[0],v[1])); break; }
      case 'POLYLINE': {
        const fl=num(e,70,0);
        if(fl&64){ // polyface mesh
          const pos=e.verts.filter(v=>!(num(v,70,0)&128)).map(v=>[num(v,10,0),num(v,20,0)]);
          e.verts.filter(v=>num(v,70,0)&128).forEach(v=>{
            const idx=[71,72,73,74].map(c=>Math.abs(num(v,c,0))).filter(x=>x>0 && x<=pos.length);
            const pts=[]; idx.forEach(x=>pts.push(pos[x-1][0],pos[x-1][1])); if(idx.length>1) pts.push(pos[idx[0]-1][0],pos[idx[0]-1][1]);
            line(pts,true);
          });
        } else {
          const vs=e.verts.filter(v=>!(num(v,70,0)&16)).map(v=>[num(v,10,0),num(v,20,0),num(v,42,0)]);
          const closed=!!(fl&1);
          line(polyBulge(vs,closed,[]),closed); vs.forEach(v=>snap(Mo,v[0],v[1]));
        }
        break; }
      case 'SPLINE': {
        const ctrl=[],fit=[],knots=[],w=[];
        for(const [c,v] of e.c){
          if(c===10) ctrl.push([+v,0]); else if(c===20&&ctrl.length) ctrl[ctrl.length-1][1]=+v;
          else if(c===11) fit.push([+v,0]); else if(c===21&&fit.length) fit[fit.length-1][1]=+v;
          else if(c===40) knots.push(+v); else if(c===41) w.push(+v);
        }
        let pts;
        if(ctrl.length) pts=splinePts(ctrl,knots,num(e,71,3), w.length===ctrl.length?w:null);
        else { pts=[]; fit.forEach(f=>pts.push(f[0],f[1])); }
        line(pts, !!(num(e,70,0)&1));
        if(pts.length>=2){ snap(M,pts[0],pts[1]); snap(M,pts[pts.length-2],pts[pts.length-1]); }
        break; }
      case 'LEADER': {
        const pts=[]; for(const [c,v] of e.c){ if(c===10) pts.push(+v,0); else if(c===20) pts[pts.length-1]=+v; }
        line(pts); break; }
      case 'SOLID': case 'TRACE': {
        const p=[[10,20],[11,21],[13,23],[12,22]].map(([a,b])=>[num(e,a,0),num(e,b,0)]);
        const loop=[]; p.forEach(q=>loop.push(q[0],q[1])); fill([loop],1); break; }
      case '3DFACE': {
        const pts=[]; [[10,20],[11,21],[12,22],[13,23]].forEach(([a,b])=>pts.push(num(e,a,0),num(e,b,0)));
        line(pts,true); break; }
      case 'POINT': { const q=tp(Mo,num(e,10,0),num(e,20,0)); points.push({L:lname,C:color,x:q[0],y:q[1]}); snaps.push(q[0],q[1]); break; }
      case 'TEXT': case 'ATTRIB': {
        if(e.type==='ATTRIB' && (num(e,70,0)&1)) break;
        const str=cleanText(e.f[1]||''); if(!str.trim()) break;
        const ha=num(e,72,0), va=num(e,e.type==='ATTRIB'?74:73,0);
        const useAlign = ha!==0 || va!==0;
        const x = useAlign && e.f[11]!==undefined ? num(e,11,0) : num(e,10,0);
        const y = useAlign && e.f[21]!==undefined ? num(e,21,0) : num(e,20,0);
        const q=tp(Mo,x,y), sc=Math.hypot(Mo[2],Mo[3]);
        texts.push({L:lname,C:color,x:q[0],y:q[1],h:num(e,40,1)*sc,rot:num(e,50,0)*D2R+Math.atan2(Mo[1],Mo[0]),wf:num(e,41,1),
          lines:[str], align:[ 'left','center','right','center','center','center'][ha]||'left',
          base:['alphabetic','bottom','middle','top'][va]||'alphabetic'});
        snaps.push(q[0],q[1]); break; }
      case 'MTEXT': {
        let raw=''; for(const [c,v] of e.c){ if(c===3) raw+=v; } raw+=(e.f[1]||'');
        const str=cleanMText(raw); if(!str.trim()) break;
        const q=tp(Mo,num(e,10,0),num(e,20,0)), sc=Math.hypot(Mo[2],Mo[3]);
        let rot = e.f[11]!==undefined ? Math.atan2(num(e,21,0),num(e,11,1)) : num(e,50,0)*D2R;
        const ap=num(e,71,1);
        texts.push({L:lname,C:color,x:q[0],y:q[1],h:num(e,40,1)*sc,rot:rot+Math.atan2(Mo[1],Mo[0]),wf:1,lines:str.split('\n'),
          align:['left','center','right'][(ap-1)%3]||'left', vpos:Math.floor((ap-1)/3), mtext:true});
        snaps.push(q[0],q[1]); break; }
      case 'INSERT': {
        const blk=dxf.blocks[(e.f[2]||'').trim()];
        if(blk && depth<16){
          const ix=num(e,10,0),iy=num(e,20,0),sx=num(e,41,1),sy=num(e,42,1),rot=num(e,50,0)*D2R;
          const cols=Math.max(1,num(e,70,1)),rows=Math.max(1,num(e,71,1)),cs=num(e,44,0),rs=num(e,45,0);
          for(let r=0;r<rows&&r<100;r++) for(let c=0;c<cols&&c<100;c++){
            const Mi=mul(Mo,mul(T(ix,iy),mul(R(rot),mul(T(c*cs,r*rs),mul(S(sx,sy),T(-blk.bx,-blk.by))))));
            for(const be of blk.entities) emit(be, Mi, lname, color, depth+1);
          }
          snap(Mo,ix,iy);
        }
        (e.attribs||[]).forEach(a=>emit(a, M, lname, color, depth+1));
        break; }
      case 'DIMENSION': {
        const blk=dxf.blocks[(e.f[2]||'').trim()];
        if(blk && depth<16) for(const be of blk.entities) emit(be, M, lname, color, depth+1);
        break; }
      case 'HATCH': {
        const loops=parseHatch(e);
        fill(loops, num(e,70,0)===1 ? 0.55 : 0.18); break; }
      case 'ATTDEF': case 'VIEWPORT': case 'SEQEND': break;
      default: unsupported[e.type]=(unsupported[e.type]||0)+1;
    }
  }
  const I=[1,0,0,1,0,0];
  for(const e of dxf.entities) emit(e, I, null, null, 0);

  // extents
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const ext=(x,y)=>{ if(!isFinite(x)||!isFinite(y)) return; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; };
  for(const p of prims){ if(p.pts) for(let k=0;k<p.pts.length;k+=2) ext(p.pts[k],p.pts[k+1]); else p.loops.forEach(l=>{ for(let k=0;k<l.length;k+=2) ext(l[k],l[k+1]); }); }
  texts.forEach(t=>ext(t.x,t.y)); points.forEach(p=>ext(p.x,p.y));
  if(!isFinite(minX)){ minX=minY=-50; maxX=maxY=50; }
  const ox=(minX+maxX)/2, oy=(minY+maxY)/2;

  // group into Path2D batches by layer + colour
  const groups=new Map();
  const grp=(L,C,fill)=>{ const k=L+'\u0000'+C+'\u0000'+fill; let g=groups.get(k); if(!g){ g={L,C,fill,path:new Path2D()}; groups.set(k,g);} return g; };
  for(const p of prims){
    if(p.pts){
      const g=grp(p.L,p.C,0), a=p.pts;
      g.path.moveTo(a[0]-ox,a[1]-oy); for(let k=2;k<a.length;k+=2) g.path.lineTo(a[k]-ox,a[k+1]-oy);
      if(p.closed) g.path.closePath();
    } else {
      const g=grp(p.L,p.C,p.fill);
      p.loops.forEach(a=>{ g.path.moveTo(a[0]-ox,a[1]-oy); for(let k=2;k<a.length;k+=2) g.path.lineTo(a[k]-ox,a[k+1]-oy); g.path.closePath(); });
    }
  }
  texts.forEach(t=>{t.x-=ox;t.y-=oy;}); points.forEach(p=>{p.x-=ox;p.y-=oy;});
  for(let k=0;k<snaps.length;k+=2){ snaps[k]-=ox; snaps[k+1]-=oy; }
  const fills=[...groups.values()].filter(g=>g.fill).sort((a,b)=>b.fill-a.fill);
  const strokes=[...groups.values()].filter(g=>!g.fill);
  return {fills,strokes,texts,points,snaps,layers,counts,unsupported,total,ox,oy,
    bbox:[minX-ox,minY-oy,maxX-ox,maxY-oy], units:dxf.header.units};
}

function parseHatch(e){
  const c=e.c; let i=0;
  const find=(code)=>{ while(i<c.length && c[i][0]!==code) i++; if(i>=c.length) return null; return parseFloat(c[i++][1]); };
  const peek=(code)=> i<c.length && c[i][0]===code;
  const loops=[], np=find(91); if(np==null) return loops;
  for(let p=0;p<np;p++){
    const flags=find(92); if(flags==null) break;
    const pts=[];
    if(flags&2){
      const hasB=find(72), closed=find(73), n=find(93)||0, vs=[];
      for(let k=0;k<n;k++){ const x=find(10), y=find(20); let b=0; if(hasB && peek(42)){ b=parseFloat(c[i][1]); i++; } vs.push([x,y,b]); }
      polyBulge(vs,true,pts);
    } else {
      const ne=find(93)||0;
      for(let k=0;k<ne;k++){
        const t=find(72);
        if(t===1){ pts.push(find(10),find(20),find(11),find(21)); }
        else if(t===2||t===3){
          const cx=find(10),cy=find(20);
          let mx,my,ra;
          if(t===2){ mx=find(40); my=0; ra=1; } else { mx=find(11); my=find(21); ra=find(40); }
          let a0=find(50)*D2R, a1=find(51)*D2R; const ccw=find(73);
          if(ccw){ while(a1<=a0) a1+=TAU; } else { a0=-a0; a1=-a1; while(a1>=a0) a1-=TAU; }
          ellPts(cx,cy,mx,my,ra,a0,a1,pts);
        }
        else if(t===4){
          const deg=find(94), rat=find(73); find(74); const nk=find(95)||0, nc=find(96)||0;
          const kn=[]; for(let q=0;q<nk;q++) kn.push(find(40));
          const ct=[], w=[]; for(let q=0;q<nc;q++){ ct.push([find(10),find(20)]); if(rat && peek(42)){ w.push(parseFloat(c[i][1])); i++; } }
          splinePts(ct,kn,deg,w.length===nc?w:null).forEach(v=>pts.push(v));
        }
      }
    }
    loops.push(pts);
  }
  return loops;
}

/* ============================== VIEW / RENDER ============================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, view={s:1,tx:0,ty:0}, dirty=true, light=false;
let measureMode=false, mPts=[], snapHit=null;
const $=id=>document.getElementById(id);
const fgColor=()=>light?'#15181d':'#e6e8ec';
const barH=()=>$('fname').parentElement.parentElement.getBoundingClientRect().height;
const statH=()=>document.querySelector('.status').getBoundingClientRect().height;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); dirty=true;
}
function fit(){
  if(!scene) return;
  const [x0,y0,x1,y1]=scene.bbox, top=barH()+12, bot=statH()+12, pad=16;
  const bw=Math.max(x1-x0,1e-9), bh=Math.max(y1-y0,1e-9);
  view.s=Math.min((W-2*pad)/bw,(H-top-bot)/bh);
  if(!isFinite(view.s)||view.s<=0) view.s=1;
  view.tx=W/2-(x0+x1)/2*view.s; view.ty=top+(H-top-bot)/2+(y0+y1)/2*view.s; dirty=true;
}
const toWorld=(px,py)=>[(px-view.tx)/view.s,(view.ty-py)/view.s];
const toScreen=(wx,wy)=>[wx*view.s+view.tx, view.ty-wy*view.s];
function zoomAt(px,py,f){
  const [wx,wy]=toWorld(px,py); view.s=Math.max(1e-12,Math.min(1e12,view.s*f));
  view.tx=px-wx*view.s; view.ty=py+wy*view.s; dirty=true;
}
const col=c=>c==='FG'?fgColor():c;

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=light?'#f7f8fa':'#0e1014'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!scene) return;
  const L=scene.layers, s=view.s;
  ctx.setTransform(DPR*s,0,0,-DPR*s,DPR*view.tx,DPR*view.ty);
  for(const g of scene.fills){ if(!L[g.L].visible) continue; ctx.globalAlpha=g.fill; ctx.fillStyle=col(g.C); ctx.fill(g.path,'evenodd'); }
  ctx.globalAlpha=1; ctx.lineWidth=1.15/s; ctx.lineJoin='round'; ctx.lineCap='round';
  for(const g of scene.strokes){ if(!L[g.L].visible) continue; ctx.strokeStyle=col(g.C); ctx.stroke(g.path); }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const p of scene.points){ if(!L[p.L].visible) continue; const [x,y]=toScreen(p.x,p.y); if(x<-5||y<-5||x>W+5||y>H+5) continue; ctx.fillStyle=col(p.C); ctx.fillRect(x-1.5,y-1.5,3,3); }
  for(const t of scene.texts){
    if(!L[t.L].visible) continue;
    const px=t.h*s; if(px<2.5) continue;
    const [x,y]=toScreen(t.x,t.y), reach=px*Math.max(...t.lines.map(l=>l.length))*t.wf+px*t.lines.length*1.5;
    if(x<-reach||y<-reach||x>W+reach||y>H+reach) continue;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-t.rot); if(t.wf!==1) ctx.scale(t.wf,1);
    ctx.fillStyle=col(t.C); ctx.font=`${px}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`; ctx.textAlign=t.align;
    if(t.mtext){
      const lh=px*1.45, n=t.lines.length; ctx.textBaseline='top';
      let y0 = t.vpos===0 ? 0 : t.vpos===1 ? -(n*lh)/2 : -(n*lh);
      t.lines.forEach((ln,k)=>ctx.fillText(ln,0,y0+k*lh));
    } else { ctx.textBaseline=t.base; ctx.fillText(t.lines[0],0,0); }
    ctx.restore();
  }
  // measure overlay
  if(measureMode){
    ctx.strokeStyle='#ff9f1a'; ctx.fillStyle='#ff9f1a'; ctx.lineWidth=2;
    const sp=mPts.map(p=>toScreen(p[0],p[1]));
    if(sp.length===2){ ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(sp[0][0],sp[0][1]); ctx.lineTo(sp[1][0],sp[1][1]); ctx.stroke(); ctx.setLineDash([]); }
    sp.forEach(q=>{ ctx.beginPath(); ctx.arc(q[0],q[1],5,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(q[0],q[1],10,0,TAU); ctx.stroke(); });
  }
  if(snapHit){ const [x,y]=toScreen(snapHit[0],snapHit[1]); ctx.strokeStyle='#ff9f1a'; ctx.lineWidth=1.5; ctx.strokeRect(x-7,y-7,14,14); }
  $('zoomInfo').textContent = scaleLabel();
}
function scaleLabel(){
  // a "nice" scale bar length in drawing units that is ~ 80px
  const raw=80/view.s, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p, nice=(m<2?1:m<5?2:5)*p;
  return `▬ ${fmt(nice)}${unitName()}`;
}
const UNITS={1:' in',2:' ft',4:' mm',5:' cm',6:' m',7:' km',8:' µin',9:' mil',10:' yd'};
const unitName=()=>scene&&UNITS[scene.units]||'';
function fmt(v){ const a=Math.abs(v); if(a===0) return '0'; if(a>=1e5) return v.toFixed(0); if(a<1e-3) return v.toExponential(2); return String(+v.toFixed(a<1?4:3)); }
(function loop(){ if(dirty){ dirty=false; render(); } requestAnimationFrame(loop); })();

/* ============================== INPUT ============================== */
const ptrs=new Map(); let tapStart=null, moved=false, lastTap={t:0,x:0,y:0};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ tapStart={x:e.clientX,y:e.clientY}; moved=false; } else moved=true;
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){ if(e.pointerType==='mouse') hover(e.clientX,e.clientY); return; }
  const old=[...ptrs.values()].map(p=>({...p}));
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const now=[...ptrs.values()];
  if(ptrs.size===1){
    const p=old[0], q=now[0];
    if(!moved && Math.hypot(q.x-tapStart.x,q.y-tapStart.y)<6) return;
    moved=true; view.tx+=q.x-p.x; view.ty+=q.y-p.y; dirty=true;
  } else if(ptrs.size>=2){
    const d0=Math.hypot(old[0].x-old[1].x,old[0].y-old[1].y), d1=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);
    const m0={x:(old[0].x+old[1].x)/2,y:(old[0].y+old[1].y)/2}, m1={x:(now[0].x+now[1].x)/2,y:(now[0].y+now[1].y)/2};
    if(d0>0) zoomAt(m0.x,m0.y,d1/d0);
    view.tx+=m1.x-m0.x; view.ty+=m1.y-m0.y; dirty=true;
  }
});
function up(e){
  if(!ptrs.has(e.pointerId)) return;
  const single=ptrs.size===1; ptrs.delete(e.pointerId);
  if(single && !moved && e.type==='pointerup') tap(e.clientX,e.clientY);
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0015))); },{passive:false});
cv.addEventListener('dblclick',e=>e.preventDefault());

function nearestSnap(px,py){
  if(!scene) return null;
  const sn=scene.snaps, r=22/view.s, [wx,wy]=toWorld(px,py); let best=null, bd=r*r;
  for(let k=0;k<sn.length;k+=2){ const dx=sn[k]-wx, dy=sn[k+1]-wy, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=[sn[k],sn[k+1]]; } }
  return best;
}
function showCoords(w){ $('coords').textContent=`x ${fmt(w[0]+scene.ox)}  y ${fmt(w[1]+scene.oy)}`; }
function hover(px,py){ if(!scene) return; const w=toWorld(px,py); showCoords(w); if(measureMode){ snapHit=nearestSnap(px,py); dirty=true; } }
function tap(px,py){
  if(!scene) return;
  const now=performance.now();
  if(!measureMode && now-lastTap.t<320 && Math.hypot(px-lastTap.x,py-lastTap.y)<30){ fit(); lastTap.t=0; return; }
  lastTap={t:now,x:px,y:py};
  const sp=measureMode?nearestSnap(px,py):null, w=sp||toWorld(px,py);
  showCoords(w);
  if(measureMode){
    if(mPts.length>=2) mPts=[];
    mPts.push(w); snapHit=null; updateMeasure(); dirty=true;
  }
}
function updateMeasure(){
  const box=$('measure');
  if(!measureMode){ box.style.display='none'; return; }
  box.style.display='block';
  if(mPts.length<2){ $('mHint').style.display='block'; $('mHint').textContent=mPts.length?'Tap the second point':'Tap the first point (snaps to ends & centres)'; $('mDist').textContent=''; $('mDet').textContent=''; return; }
  const [a,b]=mPts, dx=b[0]-a[0], dy=b[1]-a[1];
  $('mHint').style.display='none';
  $('mDist').textContent=fmt(Math.hypot(dx,dy))+unitName();
  let ang=Math.atan2(dy,dx)/D2R; if(ang<0) ang+=360;
  $('mDet').textContent=`Δx ${fmt(dx)}  Δy ${fmt(dy)}  ∠ ${ang.toFixed(2)}°`;
}

/* ============================== UI ============================== */
function toast(msg,ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
$('openBtn').onclick=()=>{ if(window.Android&&Android.openFile) Android.openFile(); else $('file').click(); };
// Called by the native app after a file is picked or opened from another app
window.onNativeFile=function(name){
  $('loading').style.display='grid';
  setTimeout(()=>{
    try{ const t=Android.takeText(); if(t==null||t===''){ toast('That file is empty or could not be read.'); } else loadText(t,name); }
    catch(err){ console.error(err); toast('Could not parse this DXF: '+err.message,4500); }
    $('loading').style.display='none';
  },30);
};
window.onNativeError=function(msg){ $('loading').style.display='none'; toast(msg,4000); };
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) openFile(f); e.target.value=''; };
$('fitBtn').onclick=fit;
$('themeBtn').onclick=()=>{ light=!light; document.body.classList.toggle('light',light); document.querySelector('meta[name=theme-color]').content=light?'#f3f4f6':'#0e1014'; dirty=true; };
$('measureBtn').onclick=()=>{ measureMode=!measureMode; mPts=[]; snapHit=null; $('measureBtn').classList.toggle('on',measureMode); updateMeasure(); dirty=true; };
function setSheet(open){ $('sheet').classList.toggle('open',open); $('scrim').style.display=open?'block':'none'; $('layersBtn').classList.toggle('on',open); }
$('layersBtn').onclick=()=>setSheet(!$('sheet').classList.contains('open'));
$('scrim').onclick=()=>setSheet(false);
$('allOn').onclick=()=>setAll(true); $('allOff').onclick=()=>setAll(false);
function setAll(v){ Object.values(scene.layers).forEach(l=>l.visible=v); renderLayers(); dirty=true; }
function renderLayers(){
  const list=$('layerList'); list.innerHTML='';
  const names=Object.keys(scene.layers).filter(n=>scene.counts[n]).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!names.length){ list.innerHTML='<div class="lr"><span class="ln" style="opacity:.6">No layers</span></div>'; return; }
  for(const n of names){
    const L=scene.layers[n], row=document.createElement('div');
    row.className='lr'+(L.visible?' vis':'');
    const c=L.tc!=null?tcHex(L.tc):aci(L.aci);
    row.innerHTML=`<span class="sw" style="background:${c==='FG'?fgColor():c}"></span><span class="ln"></span><span class="lc">${scene.counts[n]}</span><span class="tg"></span>`;
    row.querySelector('.ln').textContent=n;
    row.onclick=()=>{ L.visible=!L.visible; row.classList.toggle('vis',L.visible); dirty=true; };
    list.appendChild(row);
  }
}

function loadText(text,name){
  if(/^AutoCAD Binary DXF/.test(text.slice(0,22))){ toast('Binary DXF isn’t supported — please save the drawing as ASCII DXF.',4500); return false; }
  const dxf=parseDXF(text);
  const sc=buildScene(dxf);
  if(!sc.total && !dxf.entities.length){ toast('No drawable entities found in this file.',3500); return false; }
  scene=sc; mPts=[]; snapHit=null; updateMeasure();
  $('fname').textContent=name;
  const nl=Object.keys(sc.counts).length, uns=Object.entries(sc.unsupported);
  $('finfo').textContent=`${sc.total.toLocaleString()} entities · ${nl} layer${nl===1?'':'s'}`+(unitName()?` · units:${unitName()}`:'');
  if(uns.length) toast('Skipped: '+uns.map(([k,v])=>`${k} (${v})`).join(', '),4000);
  renderLayers(); fit(); $('coords').textContent='Tap the drawing for coordinates'; return true;
}
function openFile(f){
  $('loading').style.display='grid';
  const rd=new FileReader();
  rd.onerror=()=>{ $('loading').style.display='none'; toast('Could not read that file.'); };
  rd.onload=()=>{
    setTimeout(()=>{
      try{
        const buf=new Uint8Array(rd.result);
        let text=new TextDecoder('utf-8').decode(buf);
        if(text.includes('�')) text=new TextDecoder('windows-1252').decode(buf);
        loadText(text,f.name);
      }catch(err){ console.error(err); toast('Could not parse this DXF: '+err.message,4500); }
      $('loading').style.display='none';
    },30);
  };
  rd.readAsArrayBuffer(f);
}
// drag & drop (desktop)
let dragN=0;
addEventListener('dragenter',e=>{e.preventDefault();dragN++;$('drop').style.display='grid';});
addEventListener('dragleave',e=>{dragN--; if(dragN<=0){dragN=0;$('drop').style.display='none';}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('drop').style.display='none'; const f=e.dataTransfer.files[0]; if(f) openFile(f);});
addEventListener('resize',()=>{ resize(); });
addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') fit(); if(e.key==='Escape'){ setSheet(false); if(measureMode) $('measureBtn').click(); } });
