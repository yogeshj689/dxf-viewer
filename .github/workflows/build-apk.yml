name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # GitHub's Ubuntu runners ship with the Android SDK preinstalled ($ANDROID_HOME)
      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk DXF-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DXF-Viewer-apk
          path: DXF-Viewer.apk
      - name: Publish as GitHub Release (download on your phone from the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" DXF-Viewer.apk \
            --title "DXF Viewer v1.0.${{ github.run_number }}" \
            --notes "Download **DXF-Viewer.apk** below on your Android phone and tap it to install (allow 'Install unknown apps' if asked)." \
            --latest
